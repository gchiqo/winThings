<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Make it yours</title>
<link rel="stylesheet" href="style.css">
<style>
  .crop { height: 612px; }
</style>
</head>
<body>
<div class="blob" style="width:860px;height:860px;left:-260px;top:-320px;--c:var(--cyan);opacity:.42"></div>
<div class="blob" style="width:900px;height:900px;right:-260px;bottom:-360px;--c:var(--pink);opacity:.36"></div>
<div class="blob" style="width:520px;height:520px;right:420px;top:-200px;--c:var(--indigo)"></div>
<div class="dots"></div>

<main>
  <section class="copy">
    <h1>make it<br><span class="grad">yours.</span> 🎛️</h1>
    <p class="lede">Pick a voice, set the speed, choose your shortcuts. Light or dark, your call.</p>
  </section>

  <section class="stage">
    <div class="shot crop" style="left:10px;top:150px;width:520px;transform:rotate(-3deg)">
      <img src="assets/settings_dark.png" alt="Settings window in dark mode">
    </div>
    <div class="shot crop" style="left:440px;top:250px;width:520px;transform:rotate(3deg)">
      <img src="assets/settings_light.png" alt="Settings window in light mode">
    </div>
    <div class="sticker pink" style="left:250px;top:80px;transform:rotate(-5deg)">4 voices built in 🗣️</div>
    <div class="sticker yellow" style="left:-30px;top:800px;transform:rotate(4deg)">up to 5× speed ⚡</div>
    <div class="sticker cyan" style="left:720px;top:160px;transform:rotate(6deg)">light + dark 🌗</div>
    <div class="sticker" style="left:560px;top:910px;transform:rotate(-3deg)">your own shortcuts ⌨️</div>
  </section>
</main>
</body>
</html>
